name: Windows

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-mpv

      - name: Configure & build
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Deploy (windeployqt + mpv/ffmpeg DLLs)
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          mkdir -p dist/translations
          cp build/raceview.exe dist/
          cp build/*.qm dist/translations/ 2>/dev/null || true

          WDQ="$(command -v windeployqt || true)"
          if [ -n "$WDQ" ]; then
            "$WDQ" --release --compiler-runtime --no-translations dist/raceview.exe
          fi

          # Copy every MinGW runtime DLL the exe actually needs (Qt, mpv,
          # ffmpeg, freetype, harfbuzz, ...). cp -n keeps windeployqt's copies.
          ldd build/raceview.exe dist/*.dll 2>/dev/null \
            | grep -oE '/mingw64/bin/[^ ]+\.dll' | sort -u \
            | while read -r dll; do cp -n "$dll" dist/; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaceView-windows-x86_64
          path: dist
