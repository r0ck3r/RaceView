name: Windows

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools

      - name: Download prebuilt libmpv (dev)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-' } | Select-Object -First 1
          if (-not $asset) { throw "mpv-dev x86_64 asset not found in release $($rel.tag_name)" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          & 'C:\Program Files\7-Zip\7z.exe' x -y -o"mpv-dev" mpv-dev.7z | Out-Null
          Get-ChildItem mpv-dev | Format-Table -AutoSize

      - name: Configure & build
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMPV_ROOT="$PWD/mpv-dev"
          cmake --build build

      - name: Deploy (windeployqt + mpv/ffmpeg DLLs)
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          mkdir -p dist/translations
          cp build/raceview.exe dist/
          cp build/*.qm dist/translations/ 2>/dev/null || true

          # mpv-dev archive is flat; ffmpeg is statically baked into libmpv-2.dll.
          cp mpv-dev/libmpv-2.dll dist/

          WDQ="$(command -v windeployqt || true)"
          if [ -n "$WDQ" ]; then
            "$WDQ" --release --compiler-runtime --no-translations dist/raceview.exe
          fi

          # Resolve the FULL MinGW dependency closure. windeployqt only ships
          # Qt DLLs + plugins; it does NOT copy the third-party libs Qt6 pulls in
          # transitively (icu, pcre2, zlib, zstd, b2, double-conversion, freetype,
          # harfbuzz, md4c, png, ...). A single ldd of the .exe misses them too,
          # because they are deps of deps -> missing-DLL crash (0xC0000135) at
          # launch. Iterate ldd over everything already in dist/ until it stops
          # growing (fixpoint), copying anything from /mingw64/bin.
          copy_closure() {
            for b in dist/raceview.exe dist/*.dll; do
              ldd "$b" 2>/dev/null | grep -oE '/mingw64/bin/[^ ]+\.dll'
            done | sort -u | while read -r dll; do
              [ -e "dist/$(basename "$dll")" ] || cp "$dll" dist/
            done
          }
          for _ in 1 2 3 4 5 6 7 8; do
            before=$(find dist -maxdepth 1 -name '*.dll' | wc -l)
            copy_closure
            after=$(find dist -maxdepth 1 -name '*.dll' | wc -l)
            [ "$before" = "$after" ] && break
          done
          echo "dist DLLs: $(find dist -maxdepth 1 -name '*.dll' | wc -l)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaceView-windows-x86_64
          path: dist
