<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="RaceView">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243447"/>
      <stop offset="0.55" stop-color="#141c28"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="trackDim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3aa0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#3a4a5e" stroke-opacity="0.5" stroke-width="2"/>

  <g opacity="0.18" stroke="#cfe8ff" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="196" x2="150" y2="60"/>
    <line x1="70" y1="210" x2="188" y2="58"/>
    <line x1="104" y1="220" x2="214" y2="70"/>
  </g>

  <g>
    <rect x="52" y="150" width="150" height="16" rx="8" fill="url(#trackDim)"/>
    <rect x="52" y="176" width="120" height="16" rx="8" fill="url(#trackDim)"/>
    <rect x="52" y="124" width="150" height="16" rx="8" fill="url(#track)"/>
    <circle cx="196" cy="132" r="9" fill="#eaf6ff"/>
  </g>

  <path d="M104 64 L188 112 L104 160 Z" fill="url(#accent)" filter="url(#soft)"/>

  <g transform="translate(176 40)">
    <g fill="#e9eef5">
      <rect x="0" y="0" width="12" height="12"/>
      <rect x="24" y="0" width="12" height="12"/>
      <rect x="48" y="0" width="12" height="12"/>
      <rect x="12" y="12" width="12" height="12"/>
      <rect x="36" y="12" width="12" height="12"/>
      <rect x="0" y="24" width="12" height="12"/>
      <rect x="24" y="24" width="12" height="12"/>
      <rect x="48" y="24" width="12" height="12"/>
    </g>
    <g fill="#0a0e15">
      <rect x="12" y="0" width="12" height="12"/>
      <rect x="36" y="0" width="12" height="12"/>
      <rect x="0" y="12" width="12" height="12"/>
      <rect x="24" y="12" width="12" height="12"/>
      <rect x="48" y="12" width="12" height="12"/>
      <rect x="12" y="24" width="12" height="12"/>
      <rect x="36" y="24" width="12" height="12"/>
    </g>
